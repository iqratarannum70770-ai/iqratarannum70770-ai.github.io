<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorry Bhabhi Ji 💌</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  overflow: hidden;
}

.card {
  width: 92%;
  max-width: 430px;
  min-height: 650px;
  padding: 35px 20px;
  text-align: center;
  border-radius: 30px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(15px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

h1 {
  color: white;
  font-size: 36px;
  margin: 5px 0 5px;
}

.subtitle {
  color: #fff0f5;
  font-size: 16px;
  margin-bottom: 45px;
}

/* Envelope */

.envelope-area {
  height: 300px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.envelope {
  width: 280px;
  height: 185px;
  position: relative;
  cursor: pointer;
  transition: transform 0.3s;
}

.envelope:hover {
  transform: scale(1.04);
}

.back {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ff3f68;
  border-radius: 10px;
  box-shadow: 0 15px 30px rgba(0,0,0,.2);
}

/* Letter */

.letter {
  position: absolute;
  width: 240px;
  height: 160px;
  left: 20px;
  bottom: 15px;
  background: #fffaf3;
  color: #6b2638;
  border-radius: 8px;
  padding: 20px 12px;
  font-size: 14px;
  line-height: 1.5;
  transition: 0.8s;
  z-index: 2;
  box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

.letter strong {
  font-size: 20px;
}

/* Envelope flap */

.flap {
  position: absolute;
  z-index: 4;
  width: 0;
  height: 0;
  border-left: 140px solid transparent;
  border-right: 140px solid transparent;
  border-top: 105px solid #ff6685;
  transform-origin: top;
  transition: 0.8s;
}

/* Front */

.front {
  position: absolute;
  z-index: 5;
  bottom: 0;
  width: 100%;
  height: 105px;
  background: #ff5275;
  clip-path: polygon(0 0, 50% 65%, 100% 0, 100% 100%, 0 100%);
  border-radius: 0 0 10px 10px;
}

.envelope.open .flap {
  transform: rotateX(180deg);
  z-index: 1;
}

.envelope.open .letter {
  transform: translateY(-115px);
  z-index: 3;
}

/* Heart seal */

.seal {
  position: absolute;
  z-index: 8;
  left: 50%;
  top: 92px;
  transform: translateX(-50%);
  font-size: 38px;
  transition: .5s;
}

.envelope.open .seal {
  opacity: 0;
  transform: translateX(-50%) scale(0);
}

/* Message */

.message {
  color: white;
  font-size: 17px;
  line-height: 1.7;
  margin-top: 5px;
}

.highlight {
  font-weight: bold;
  color: #fff;
}

.hint {
  margin-top: 20px;
  color: #ffe9ef;
  font-size: 13px;
}

/* WhatsApp button */

.whatsapp {
  display: inline-block;
  margin-top: 22px;
  padding: 13px 24px;
  border-radius: 50px;
  background: #25D366;
  color: white;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}

.whatsapp:hover {
  transform: scale(1.05);
}

/* Floating hearts */

.heart {
  position: fixed;
  color: white;
  opacity: .55;
  font-size: 22px;
  animation: float 5s linear infinite;
}

.h1 { left: 10%; animation-delay: 0s; }
.h2 { left: 80%; animation-delay: 1s; }
.h3 { left: 25%; animation-delay: 2s; }
.h4 { left: 65%; animation-delay: 3s; }

@keyframes float {
  0% {
    bottom: -50px;
    transform: translateX(0) rotate(0);
  }

  50% {
    transform: translateX(30px) rotate(20deg);
  }

  100% {
    bottom: 110%;
    transform: translateX(-20px) rotate(-20deg);
  }
}
</style>
</head>

<body>

<div class="heart h1">❤️</div>
<div class="heart h2">💗</div>
<div class="heart h3">💕</div>
<div class="heart h4">❤️</div>

<div class="card">

  <h1>Sorry Bhabhi Ji 🥺❤️</h1>

  <div class="subtitle">
    Ek chhoti si baat dil se kehni hai...
  </div>

  <div class="envelope-area">

    <div class="envelope" id="envelope" onclick="openLetter()">

      <div class="back"></div>

      <div class="letter">
        <strong>Bhabhi Ji ❤️</strong>
        <br><br>

        Galti ho gayi... 🥺<br>
        Dil se sorry bol raha hoon.
        <br><br>

    
        Aapki smile zyada achhi lagti hai ❤️
      </div>

      <div class="flap"></div>

      <div class="front"></div>

      <div class="seal">❤️</div>

    </div>

  </div>

  <div class="message">

    <span class="highlight">
    </span>

  </div>

  <div class="hint">
    💌 Envelope par click karo
  </div>

  <a
    class="whatsapp"
    href="https://wa.me/?text=Sorry%20Bhabhi%20Ji%20%E2%9D%A4%EF%B8%8F%20Please%20maan%20jao%20na%20%F0%9F%A5%BA"
    target="_blank">
    WhatsApp par bhejo 💚
  </a>

</div>

<script>

function openLetter() {

  const envelope = document.getElementById("envelope");

  envelope.classList.toggle("open");

}

</script>

</body>
</html>
